[package]
name = "e1004-fuzz"
version = "0.1.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[patch.crates-io]
trouble-host = { path = "../vendor/trouble-host" }

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
serde_json = "=1.0.154"
device-core = { path = "../crates/device-core" }
e1004-bsp = { path = "../crates/e1004-bsp" }
device-ui = { path = "../crates/device-ui" }
device-preview = { path = "../crates/preview" }
xtask = { path = "../xtask" }
device-runtime = { path = "../crates/device-runtime", features = [
  "virtual-time",
] }
critical-section = { version = "=1.2.0", features = ["std"] }
embassy-time = { version = "=0.5.1", features = [
  "mock-driver",
  "generic-queue-64",
] }
nb = "=1.1.0"
syn = { version = "=2.0.119", features = ["full"] }
quote = "=1.0.47"

[[bin]]
name = "boundaries"
path = "fuzz_targets/boundaries.rs"
test = false
doc = false
bench = false
