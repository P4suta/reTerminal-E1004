[advisories]
db-path = "$E1004_ADVISORY_DB"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"

[licenses]
allow = [
  "MIT",
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "NCSA",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.95

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
