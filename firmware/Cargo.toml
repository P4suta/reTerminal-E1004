[package]
name = "e1004-firmware"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[workspace]

[patch.crates-io]
trouble-host = { path = "../vendor/trouble-host" }

[features]
default = []
wifi = ["dep:esp-radio", "esp-radio/wifi", "esp-rtos/esp-radio"]
coex = ["wifi", "ble", "esp-radio/coex"]
ble = [
  "device-runtime/ble",
  "dep:esp-radio",
  "esp-radio/ble",
  "esp-radio/unstable",
  "dep:trouble-host",
  "esp-rtos/esp-radio",
]

[dependencies]
device-core = { path = "../crates/device-core" }
device-ui = { path = "../crates/device-ui" }
device-runtime = { path = "../crates/device-runtime" }
e1004-bsp = { path = "../crates/e1004-bsp" }
t133a01 = { path = "../crates/t133a01" }
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "=0.4.0", features = [
  "esp32s3",
  "embassy",
  "esp-alloc",
] }
esp-alloc = { version = "=0.11.0", features = ["esp32s3", "nightly"] }
esp-storage = { version = "=0.10.0", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
esp-radio = { version = "=1.0.0-beta.1", features = [
  "esp32s3",
], optional = true }
trouble-host = { version = "=0.8.0", default-features = false, features = [
  "peripheral",
  "gatt",
  "derive",
], optional = true }
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"
embassy-sync = "=0.8.0"
embassy-futures = "=0.1.2"
embedded-hal = "=1.0.0"
embedded-hal-bus = "=0.3.0"
embedded-sdmmc = { version = "=0.10.0", default-features = false }
nb = "=1.1.0"
static_cell = "=2.1.1"
heapless = "=0.9.3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
overflow-checks = true

[lints.clippy]
mem_forget = "deny"
